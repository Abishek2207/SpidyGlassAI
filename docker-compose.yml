version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - SARVAM_API_KEY=${SARVAM_API_KEY}
    volumes:
      - ./backend/spiderglass.db:/app/spiderglass.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
