version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: spiderglass
      POSTGRES_PASSWORD: password
      POSTGRES_DB: spiderglass_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - SARVAM_API_KEY=${SARVAM_API_KEY}
      - DATABASE_URL=postgresql://spiderglass:password@db:5432/spiderglass_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
